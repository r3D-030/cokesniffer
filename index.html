<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COKESNIFFER</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --pink: #ff007f;
            --blue: #00d4ff;
            --purple: #9d00ff;
            --dark: #020209;
            --card-bg: rgba(5, 5, 20, 0.85);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: var(--dark);
            color: white;
            font-family: 'Rajdhani', sans-serif;
        }

        /* ========== CANVAS ========== */
        canvas#particles {
            position: fixed;
            inset: 0;
            z-index: 0;
            pointer-events: none;
        }

        /* ========== GRID OVERLAY ========== */
        .grid-overlay {
            position: fixed;
            inset: 0;
            z-index: 1;
            pointer-events: none;
            background-image:
                linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
            background-size: 60px 60px;
            animation: gridShift 20s linear infinite;
        }
        @keyframes gridShift {
            0%   { background-position: 0 0; }
            100% { background-position: 60px 60px; }
        }

        /* ========== AMBIENT BLOBS ========== */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            pointer-events: none;
            z-index: 1;
            animation: blobFloat 10s ease-in-out infinite alternate;
        }
        .blob-1 {
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(255,0,127,0.25), transparent 70%);
            top: -100px; left: -100px;
            animation-delay: 0s;
        }
        .blob-2 {
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(0,212,255,0.2), transparent 70%);
            bottom: -150px; right: -150px;
            animation-delay: -5s;
        }
        .blob-3 {
            width: 350px; height: 350px;
            background: radial-gradient(circle, rgba(157,0,255,0.2), transparent 70%);
            top: 40%; left: 50%;
            transform: translate(-50%,-50%);
            animation-delay: -2.5s;
        }
        @keyframes blobFloat {
            0%   { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.2) translate(30px, -30px); }
        }

        /* ========== SCANLINE ========== */
        .scanline {
            position: fixed;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background: repeating-linear-gradient(
                to bottom,
                transparent 0px,
                transparent 3px,
                rgba(0,0,0,0.07) 3px,
                rgba(0,0,0,0.07) 4px
            );
        }

        /* ========== ANIME CHARACTER (SVG) ========== */
        .anime-wrapper {
            position: fixed;
            right: -10px;
            bottom: 0;
            z-index: 3;
            width: 420px;
            height: 700px;
            pointer-events: none;
            animation: characterFloat 6s ease-in-out infinite;
            filter: drop-shadow(0 0 25px rgba(0,212,255,0.4)) drop-shadow(0 0 60px rgba(255,0,127,0.2));
            opacity: 0;
            transform: translateX(60px);
            transition: opacity 1.5s ease 1s, transform 1.5s ease 1s;
        }
        .anime-wrapper.visible {
            opacity: 1;
            transform: translateX(0);
        }
        @keyframes characterFloat {
            0%, 100% { transform: translateY(0px); }
            50%       { transform: translateY(-18px); }
        }
        .anime-wrapper svg { width: 100%; height: 100%; }

        /* ========== MAIN LAYOUT ========== */
        .scene {
            position: fixed;
            inset: 0;
            z-index: 4;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding-left: 8vw;
        }

        /* ========== CARD ========== */
        .card {
            position: relative;
            background: var(--card-bg);
            border: 1px solid rgba(0,212,255,0.15);
            border-radius: 24px;
            padding: 56px 60px;
            max-width: 520px;
            width: 100%;
            backdrop-filter: blur(24px);
            box-shadow:
                0 0 0 1px rgba(255,0,127,0.08),
                0 0 40px rgba(0,212,255,0.08),
                0 0 80px rgba(255,0,127,0.06),
                inset 0 1px 0 rgba(255,255,255,0.06);
            opacity: 0;
            transform: translateY(40px);
            transition: opacity 1s ease 0.3s, transform 1s ease 0.3s;
        }
        .card.visible {
            opacity: 1;
            transform: translateY(0);
        }

        /* Corner accents */
        .card::before, .card::after {
            content: '';
            position: absolute;
            width: 24px; height: 24px;
            border-color: var(--pink);
            border-style: solid;
        }
        .card::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; border-radius: 4px 0 0 0; }
        .card::after  { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; border-radius: 0 0 4px 0; }

        .corner-tr, .corner-bl {
            position: absolute;
            width: 24px; height: 24px;
            border-color: var(--blue);
            border-style: solid;
        }
        .corner-tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; border-radius: 0 4px 0 0; }
        .corner-bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; border-radius: 0 0 0 4px; }

        /* ========== BADGE ========== */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(0,212,255,0.08);
            border: 1px solid rgba(0,212,255,0.2);
            border-radius: 100px;
            padding: 5px 14px;
            font-size: 0.7rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: var(--blue);
            margin-bottom: 24px;
            opacity: 0;
            animation: fadeUp 0.8s ease 0.8s forwards;
        }
        .badge-dot {
            width: 6px; height: 6px;
            border-radius: 50%;
            background: var(--blue);
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%,100% { opacity: 1; transform: scale(1); }
            50%      { opacity: 0.4; transform: scale(0.8); }
        }

        /* ========== TITLE ========== */
        .title {
            font-family: 'Orbitron', monospace;
            font-size: clamp(2.2rem, 5vw, 3.4rem);
            font-weight: 900;
            letter-spacing: 6px;
            line-height: 1;
            text-transform: uppercase;
            margin-bottom: 10px;
            position: relative;
            opacity: 0;
            animation: fadeUp 0.8s ease 1s forwards;
        }
        .title-inner {
            background: linear-gradient(120deg, #fff 20%, var(--blue) 50%, var(--pink) 80%);
            background-size: 200%;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 4s linear infinite;
        }
        @keyframes shimmer {
            0%   { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        /* Glitch effect */
        .title::before, .title::after {
            content: 'COKESNIFFER';
            position: absolute;
            top: 0; left: 0;
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            letter-spacing: 6px;
            -webkit-text-fill-color: transparent;
        }
        .title::before {
            background: linear-gradient(120deg, var(--pink), transparent);
            -webkit-background-clip: text;
            clip-path: polygon(0 30%, 100% 30%, 100% 50%, 0 50%);
            animation: glitch1 6s infinite;
        }
        .title::after {
            background: linear-gradient(120deg, var(--blue), transparent);
            -webkit-background-clip: text;
            clip-path: polygon(0 60%, 100% 60%, 100% 80%, 0 80%);
            animation: glitch2 6s infinite;
        }
        @keyframes glitch1 {
            0%,90%,100% { transform: translate(0); opacity: 0; }
            92%          { transform: translate(-3px, 1px); opacity: 0.7; }
            94%          { transform: translate(3px, -1px); opacity: 0; }
            96%          { transform: translate(-2px, 0); opacity: 0.5; }
        }
        @keyframes glitch2 {
            0%,90%,100% { transform: translate(0); opacity: 0; }
            91%          { transform: translate(3px, -2px); opacity: 0.6; }
            93%          { transform: translate(-3px, 2px); opacity: 0; }
            95%          { transform: translate(2px, 0); opacity: 0.4; }
        }

        /* ========== SUBTITLE ========== */
        .subtitle {
            color: rgba(180,190,220,0.7);
            font-size: 0.95rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
            opacity: 0;
            animation: fadeUp 0.8s ease 1.1s forwards;
        }

        /* ========== DIVIDER ========== */
        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, var(--pink), var(--blue), transparent);
            margin: 28px 0;
            opacity: 0;
            animation: fadeUp 0.8s ease 1.2s forwards;
        }

        /* ========== STATS ROW ========== */
        .stats {
            display: flex;
            gap: 24px;
            margin-bottom: 32px;
            opacity: 0;
            animation: fadeUp 0.8s ease 1.3s forwards;
        }
        .stat {
            flex: 1;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 12px;
            padding: 14px 12px;
            text-align: center;
        }
        .stat-num {
            font-family: 'Orbitron', monospace;
            font-size: 1.3rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--pink), var(--blue));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: block;
        }
        .stat-label {
            font-size: 0.65rem;
            letter-spacing: 2px;
            color: rgba(180,190,220,0.5);
            text-transform: uppercase;
            margin-top: 4px;
        }

        /* ========== BUTTONS ========== */
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 16px;
            opacity: 0;
            animation: fadeUp 0.8s ease 1.4s forwards;
        }

        .btn {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 18px 28px;
            border-radius: 14px;
            text-decoration: none;
            color: white;
            font-family: 'Orbitron', monospace;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            border: 1px solid transparent;
            overflow: hidden;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275),
                        box-shadow 0.3s ease;
        }
        .btn::before {
            content: '';
            position: absolute;
            inset: 0;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
        .btn:hover { transform: translateY(-4px); }
        .btn:hover::before { opacity: 1; }

        .btn-icon {
            font-size: 1.2rem;
            transition: transform 0.3s ease;
        }
        .btn:hover .btn-icon { transform: translateX(6px); }

        .btn-arrow {
            width: 32px; height: 32px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 0.9rem;
            transition: transform 0.3s ease, background 0.3s ease;
        }

        /* Sileo */
        .sileo {
            background: linear-gradient(135deg, rgba(255,0,127,0.15), rgba(255,0,127,0.05));
            border-color: rgba(255,0,127,0.3);
            box-shadow: 0 0 20px rgba(255,0,127,0.1), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .sileo::before {
            background: linear-gradient(135deg, rgba(255,0,127,0.35), rgba(255,0,127,0.15));
        }
        .sileo:hover {
            box-shadow: 0 0 40px rgba(255,0,127,0.35), 0 8px 30px rgba(255,0,127,0.2);
            border-color: var(--pink);
        }
        .sileo .btn-arrow {
            background: rgba(255,0,127,0.2);
            color: var(--pink);
        }
        .sileo:hover .btn-arrow {
            background: var(--pink);
            color: white;
            transform: translateX(4px);
        }

        /* Zebra */
        .zebra {
            background: linear-gradient(135deg, rgba(0,212,255,0.15), rgba(0,212,255,0.05));
            border-color: rgba(0,212,255,0.3);
            box-shadow: 0 0 20px rgba(0,212,255,0.1), inset 0 1px 0 rgba(255,255,255,0.05);
        }
        .zebra::before {
            background: linear-gradient(135deg, rgba(0,212,255,0.35), rgba(0,212,255,0.15));
        }
        .zebra:hover {
            box-shadow: 0 0 40px rgba(0,212,255,0.35), 0 8px 30px rgba(0,212,255,0.2);
            border-color: var(--blue);
        }
        .zebra .btn-arrow {
            background: rgba(0,212,255,0.2);
            color: var(--blue);
        }
        .zebra:hover .btn-arrow {
            background: var(--blue);
            color: #000;
            transform: translateX(4px);
        }

        /* ========== BOTTOM TAG ========== */
        .footer-tag {
            margin-top: 28px;
            display: flex;
            align-items: center;
            gap: 10px;
            opacity: 0;
            animation: fadeUp 0.8s ease 1.6s forwards;
        }
        .footer-line {
            flex: 1;
            height: 1px;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1));
        }
        .footer-text {
            font-size: 0.65rem;
            letter-spacing: 3px;
            color: rgba(180,190,220,0.3);
            text-transform: uppercase;
        }

        /* ========== HUD ELEMENTS ========== */
        .hud-top, .hud-bottom {
            position: fixed;
            z-index: 5;
            pointer-events: none;
            display: flex;
            align-items: center;
            gap: 16px;
            font-family: 'Orbitron', monospace;
            font-size: 0.6rem;
            letter-spacing: 3px;
            color: rgba(0,212,255,0.3);
            text-transform: uppercase;
        }
        .hud-top { top: 24px; left: 28px; }
        .hud-bottom { bottom: 24px; right: 28px; }

        .hud-dot {
            width: 5px; height: 5px;
            border-radius: 50%;
            background: var(--blue);
            animation: pulse 2s ease-in-out infinite;
        }

        /* Horizontal scan line that sweeps down */
        .sweep-line {
            position: fixed;
            left: 0; right: 0;
            height: 2px;
            background: linear-gradient(to right, transparent, var(--blue), transparent);
            z-index: 2;
            opacity: 0.3;
            animation: sweep 8s linear infinite;
        }
        @keyframes sweep {
            0%   { top: -2px; }
            100% { top: 100vh; }
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* ========== RESPONSIVE ========== */
        @media (max-width: 900px) {
            .anime-wrapper { width: 260px; height: 440px; right: -20px; opacity: 0.4; }
            .scene { padding-left: 5vw; justify-content: center; }
            .card { padding: 40px 32px; }
        }
        @media (max-width: 600px) {
            .anime-wrapper { display: none; }
            .scene { padding: 0 16px; }
            .card { padding: 32px 20px; }
            .title { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

<!-- Canvas particles -->
<canvas id="particles"></canvas>

<!-- Grid & Scanline -->
<div class="grid-overlay"></div>
<div class="scanline"></div>
<div class="sweep-line"></div>

<!-- Ambient blobs -->
<div class="blob blob-1"></div>
<div class="blob blob-2"></div>
<div class="blob blob-3"></div>

<!-- HUD -->
<div class="hud-top"><div class="hud-dot"></div>SYS.ONLINE // REPO.ACTIVE</div>
<div class="hud-bottom">COKESNIFFER v2.0 <div class="hud-dot"></div> 2087</div>

<!-- Anime character SVG -->
<div class="anime-wrapper" id="animeChar">
    <svg viewBox="0 0 420 700" xmlns="http://www.w3.org/2000/svg" fill="none">
        <defs>
            <linearGradient id="hairGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#00d4ff"/>
                <stop offset="100%" stop-color="#9d00ff"/>
            </linearGradient>
            <linearGradient id="coatGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#0d0d2b"/>
                <stop offset="100%" stop-color="#1a0a2e"/>
            </linearGradient>
            <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" stop-color="#ff007f" stop-opacity="0.6"/>
                <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
            </linearGradient>
            <filter id="glow">
                <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
                <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <filter id="softGlow">
                <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
                <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
            </filter>
            <radialGradient id="eyeGlow" cx="50%" cy="50%" r="50%">
                <stop offset="0%" stop-color="#00d4ff"/>
                <stop offset="60%" stop-color="#9d00ff"/>
                <stop offset="100%" stop-color="#1a0030"/>
            </radialGradient>
        </defs>

        <!-- Ground glow -->
        <ellipse cx="210" cy="680" rx="140" ry="20" fill="url(#glowGrad)" opacity="0.5"/>

        <!-- === BODY / COAT === -->
        <!-- Long futuristic coat -->
        <path d="M120 340 Q100 420 80 560 Q75 600 90 620 L140 620 L150 520 L165 620 L255 620 L270 520 L280 620 L330 620 Q345 600 340 560 Q320 420 300 340 Z" fill="url(#coatGrad)" stroke="rgba(0,212,255,0.4)" stroke-width="1.5"/>

        <!-- Coat inner panel lines -->
        <path d="M165 350 L155 500 M255 350 L265 500" stroke="rgba(0,212,255,0.25)" stroke-width="1" stroke-dasharray="4,6"/>
        <path d="M180 355 L210 600 L240 355" stroke="rgba(0,212,255,0.15)" stroke-width="1"/>

        <!-- Coat belt -->
        <rect x="130" y="420" width="160" height="12" rx="6" fill="rgba(255,0,127,0.2)" stroke="rgba(255,0,127,0.5)" stroke-width="1"/>
        <rect x="195" y="416" width="30" height="20" rx="4" fill="rgba(0,212,255,0.2)" stroke="rgba(0,212,255,0.6)" stroke-width="1"/>

        <!-- Glowing trim on coat edges -->
        <path d="M120 340 Q100 420 80 560 Q75 600 90 620" stroke="rgba(0,212,255,0.6)" stroke-width="1.5" filter="url(#glow)"/>
        <path d="M300 340 Q320 420 340 560 Q345 600 330 620" stroke="rgba(255,0,127,0.6)" stroke-width="1.5" filter="url(#glow)"/>

        <!-- Circuit lines on coat -->
        <path d="M130 380 L150 380 L155 390 L170 390" stroke="rgba(0,212,255,0.3)" stroke-width="1"/>
        <circle cx="170" cy="390" r="2" fill="#00d4ff" opacity="0.6"/>
        <path d="M290 380 L270 380 L265 390 L250 390" stroke="rgba(255,0,127,0.3)" stroke-width="1"/>
        <circle cx="250" cy="390" r="2" fill="#ff007f" opacity="0.6"/>
        <path d="M135 450 L160 450 L165 460" stroke="rgba(0,212,255,0.25)" stroke-width="1"/>
        <path d="M285 450 L260 450 L255 460" stroke="rgba(255,0,127,0.25)" stroke-width="1"/>

        <!-- Boots -->
        <path d="M90 620 L78 700 L115 700 L140 620 Z" fill="#0a0a1a" stroke="rgba(0,212,255,0.4)" stroke-width="1.5"/>
        <path d="M330 620 L342 700 L305 700 L280 620 Z" fill="#0a0a1a" stroke="rgba(255,0,127,0.4)" stroke-width="1.5"/>
        <!-- Boot glow lines -->
        <path d="M82 680 L110 680" stroke="#00d4ff" stroke-width="1" opacity="0.6"/>
        <path d="M338 680 L308 680" stroke="#ff007f" stroke-width="1" opacity="0.6"/>

        <!-- === TORSO UNDER COAT === -->
        <path d="M150 260 Q140 290 130 340 L290 340 Q280 290 270 260 Z" fill="#0f0f28" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>

        <!-- Chest piece / armor -->
        <path d="M170 275 L210 265 L250 275 L255 320 L210 330 L165 320 Z" fill="rgba(0,212,255,0.08)" stroke="rgba(0,212,255,0.3)" stroke-width="1.5"/>
        <!-- Core glowing orb -->
        <circle cx="210" cy="298" r="14" fill="rgba(0,212,255,0.1)" stroke="rgba(0,212,255,0.5)" stroke-width="1.5"/>
        <circle cx="210" cy="298" r="8" fill="rgba(0,212,255,0.2)"/>
        <circle cx="210" cy="298" r="4" fill="#00d4ff" filter="url(#softGlow)" opacity="0.8">
            <animate attributeName="opacity" values="0.8;0.3;0.8" dur="2s" repeatCount="indefinite"/>
            <animate attributeName="r" values="4;6;4" dur="2s" repeatCount="indefinite"/>
        </circle>

        <!-- === NECK === -->
        <rect x="198" y="242" width="24" height="24" rx="4" fill="#e8c9a0"/>

        <!-- === HEAD === -->
        <ellipse cx="210" cy="210" rx="65" ry="72" fill="#f0d5b0"/>
        <!-- Jaw refinement -->
        <path d="M155 220 Q145 250 165 265 Q185 278 210 278 Q235 278 255 265 Q275 250 265 220" fill="#f0d5b0"/>

        <!-- Ear (right) -->
        <ellipse cx="275" cy="215" rx="10" ry="14" fill="#e8c9a0"/>
        <!-- Ear (left) -->
        <ellipse cx="145" cy="215" rx="10" ry="14" fill="#e8c9a0"/>

        <!-- === HAIR === -->
        <!-- Main hair mass -->
        <path d="M150 145 Q130 120 135 95 Q140 65 165 55 Q180 40 210 38 Q240 40 255 55 Q280 65 285 95 Q290 120 270 145 Q255 110 245 105 Q230 95 210 95 Q190 95 175 105 Q165 110 150 145 Z" fill="url(#hairGrad)"/>
        <!-- Hair spikes top -->
        <path d="M175 70 L165 30 L195 65" fill="url(#hairGrad)"/>
        <path d="M210 60 L205 18 L225 58" fill="url(#hairGrad)"/>
        <path d="M245 70 L255 28 L235 65" fill="url(#hairGrad)"/>
        <!-- Side hair -->
        <path d="M150 150 L120 130 L130 170 L145 175" fill="url(#hairGrad)"/>
        <path d="M270 150 L300 130 L290 170 L275 175" fill="url(#hairGrad)"/>
        <!-- Hair sheen -->
        <path d="M180 80 Q200 70 220 80" stroke="rgba(255,255,255,0.3)" stroke-width="2" fill="none" stroke-linecap="round"/>

        <!-- === EYES === -->
        <!-- Eye sockets -->
        <ellipse cx="181" cy="210" rx="22" ry="18" fill="white"/>
        <ellipse cx="239" cy="210" rx="22" ry="18" fill="white"/>
        <!-- Iris -->
        <circle cx="181" cy="212" r="14" fill="url(#eyeGlow)"/>
        <circle cx="239" cy="212" r="14" fill="url(#eyeGlow)"/>
        <!-- Pupil -->
        <circle cx="181" cy="212" r="7" fill="#0a0020"/>

<script>
// ====== PARTICLES ======
const canvas = document.getElementById('particles');
const ctx = canvas.getContext('2d');
let particles = [];

function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resize();
window.addEventListener('resize', resize);

class Particle {
    constructor() { this.reset(); }
    reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 1.5 + 0.3;
        this.speedY = -(Math.random() * 0.4 + 0.1);
        this.speedX = (Math.random() - 0.5) * 0.2;
        this.opacity = Math.random() * 0.5 + 0.1;
        this.color = Math.random() > 0.5 ? '#00d4ff' : Math.random() > 0.5 ? '#ff007f' : '#9d00ff';
        this.life = 0;
        this.maxLife = Math.random() * 300 + 200;
    }
    update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.life++;
        if (this.life > this.maxLife || this.y < 0) this.reset();
    }
    draw() {
        ctx.save();
        ctx.globalAlpha = this.opacity * (1 - this.life / this.maxLife);
        ctx.fillStyle = this.color;
        ctx.shadowBlur = 6;
        ctx.shadowColor = this.color;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

for (let i = 0; i < 120; i++) particles.push(new Particle());

function animateParticles() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(p => { p.update(); p.draw(); });
    requestAnimationFrame(animateParticles);
}
animateParticles();

// ====== ENTRY ANIMATION ======
window.addEventListener('load', () => {
    setTimeout(() => {
        document.getElementById('mainCard').classList.add('visible');
        document.getElementById('animeChar').classList.add('visible');
    }, 100);
    // Count-up animation
    countUp('tweakCount', 24, 1800);
    countUp('downloadCount', 8300, 2200);
});

function countUp(id, target, duration) {
    const el = document.getElementById(id);
    const start = Date.now();
    const step = () => {
        const progress = Math.min((Date.now() - start) / duration, 1);
        const eased = 1 - Math.pow(1 - progress, 3);
        const value = Math.floor(eased * target);
        el.textContent = target >= 1000 ? (value >= 1000 ? (value/1000).toFixed(1)+'K' : value) : value;
        if (progress < 1) requestAnimationFrame(step);
        else el.textContent = target >= 1000 ? (target/1000).toFixed(1)+'K' : target;
    };
    setTimeout(step, 1400);
}

// ====== MOUSE PARALLAX ======
document.addEventListener('mousemove', (e) => {
    const x = (e.clientX / window.innerWidth - 0.5) * 2;
    const y = (e.clientY / window.innerHeight - 0.5) * 2;
    const char = document.getElementById('animeChar');
    char.style.transform = `translateX(${x * -8}px) translateY(${y * -6}px)`;
    document.querySelector('.blob-3').style.transform =
        `translate(calc(-50% + ${x * 20}px), calc(-50% + ${y * 20}px))`;
});
</script>
