name: Update Repo
on:
  push:
    branches:
      - main
    paths:
      - 'debs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Generate Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev bzip2
          # الماكينة توه باش تقرأ ملفات الـ deb وتطلع الاسامي وحدها
          dpkg-scanpackages -m ./debs > Packages
          bzip2 -f -k Packages
          
      - name: Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add Packages Packages.bz2
          git commit -m "Update Repo Packages" || echo "No changes to commit"
          git push
